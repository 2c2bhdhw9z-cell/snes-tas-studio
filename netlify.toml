# netlify.toml — deploy config for the SNES TAS Studio PWA.
#
# This is a static site (no build step). Netlify serves the repo root as-is.
#
# The header strategy below is deliberate and tuned for iOS Safari:
#
#   * The bsnes-mercury accuracy WASM core is built SINGLE-THREADED on purpose
#     (no pthreads, no SharedArrayBuffer). Therefore we intentionally do NOT set
#     Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy. COOP/COEP
#     (crossOriginIsolated) is only required for SharedArrayBuffer/threads, and
#     enabling COEP: require-corp on iOS Safari has historically blocked
#     same-origin sub-resource loads (including the ROM and .wasm) and broken
#     PWAs. Setting it here would add risk for zero benefit for this core.
#
#   * We DO serve the correct MIME type for .wasm so the browser can stream-
#     compile it (application/wasm), and set caching that keeps the app instantly
#     updatable while letting the large immutable core/ROM cache hard.

[build]
  # Static site: nothing to compile. Publish the repository root.
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# WebAssembly: correct MIME type is required for WebAssembly.instantiateStreaming
# and for reliable loading on Safari.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    # The core is a large, content-addressed build artifact; cache it hard.
    Cache-Control = "public, max-age=31536000, immutable"

# The Emscripten JS loader that instantiates the core.
[[headers]]
  for = "/cores/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# ROM: large and immutable once uploaded; served same-origin. Cache hard.
# (No COEP is set anywhere, so this loads without cross-origin-isolation issues
# on iOS Safari.)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# App shell: must always revalidate so a new deploy is picked up immediately,
# and the service worker can manage true offline caching.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The service worker itself must never be served stale, or clients get stuck on
# an old cache version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "no-cache"

# The PWA manifest.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"
