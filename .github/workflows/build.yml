name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine is plain Swift, so its tests run on Linux in about a minute.
  engine-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib headers
        run: apt-get update -qq && apt-get install -y -qq zlib1g-dev
      - name: Test SignKit
        run: swift test --package-path Packages/SignKit

  app:
    runs-on: macos-15
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Set the version from the run number
        working-directory: App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Signer/Info.plist || true

      - name: Build
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild \
            -project Signer.xcodeproj \
            -scheme Signer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            | xcpretty || xcodebuild \
            -project Signer.xcodeproj \
            -scheme Signer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Make the .ipa
        working-directory: App
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "built: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          # An ad-hoc signature keeps iOS from refusing the file outright before it is re-signed.
          codesign --force --sign - --timestamp=none "out/Payload/$(basename "$APP")" || true
          cd out && zip -qry ../Signer.ipa Payload && cd ..
          ls -la Signer.ipa
          unzip -l Signer.ipa | head -20

      - name: Check what we built
        working-directory: App
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
          echo "build:   $(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
          echo "id:      $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          ls -la "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: Signer-ipa
          path: App/Signer.ipa
          if-no-files-found: error

      - name: Publish a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" App/Signer.ipa \
            --title "Signer build ${{ github.run_number }}" \
            --notes "Unsigned build. Sign it with your own certificate, or install it with another signer." \
            || gh release upload "$TAG" App/Signer.ipa --clobber
